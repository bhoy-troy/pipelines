[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Pipelines"
version = "0.0.1"
description = "Tool for managing pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "bhoy-troy", email = "james@james-troy.com"}
]
maintainers = [
    {name = "bhoy-troy", email = "james@james-troy.com"}
]
keywords = [
    "deepseek",
    "grok",
    "gemeni",
    "python"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]






# Linting only
lint = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "types-PyYAML>=6.0.0",
]

[project.urls]
Homepage = "https://tiny.distro.builders"
Documentation = "https://github.com/bhoy-troy/pipelines"
Repository = "https://github.com/bhoy-troy/pipelines"
Issues = "https://github.com/bhoy-troy/pipelines/issues"

[project.scripts]
content-resolver = "src.run_weekly:main"

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py314"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
]

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), isort (I), pep8-naming (N),
# pyupgrade (UP), flake8-bugbear (B), flake8-comprehensions (C4)
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by black)
    "E203",  # Whitespace before ':' (conflicts with black)
    "UP031", # Use format specifiers instead of percent format
    "B019",  # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling


]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

# Mypy configuration
[tool.mypy]
python_version = "3.14"
warn_return_any = false  # Disabled - too many Any types from untyped external libraries
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = false  # Disabled - some defensive code paths are intentionally unreachable
strict_equality = true
ignore_missing_imports = true

# Disable specific error codes that are caused by intentional design patterns
disable_error_code = [
    "union-attr",      # Methods like workloads() intentionally return bool | list[str] based on params
    "var-annotated",   # Don't require type annotations for all local variables
    "misc",            # Exception variable scoping in except blocks
]

[[tool.mypy.overrides]]
module = "libdnf5.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "koji.*"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=content_resolver",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["content_resolver"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Bandit security scanner configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "output",
]
skips = [
    "B101",  # assert_used - we use asserts in tests
]
