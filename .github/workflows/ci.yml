# Registry push (image_build) uses these repository secrets when not using
# ghcr.io with GITHUB_TOKEN:
#   REGISTRY          - registry host (e.g. quay.io, registry.example.com)
#   REGISTRY_USER     - login username
#   REGISTRY_PASSWORD - login password or token
# Optional:
#   REGISTRY_IMAGE    - image repository path without tag (default: ghcr.io/<owner>/<repo>)

name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: pipelines

jobs:
  ruff-check:
    name: Ruff Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/ruff:alpine
    steps:
      - uses: actions/checkout@v6
      - name: Ruff version
        run: ruff --version
      - name: Ruff check
        run: |
          ruff check
      - name: Ruff check (CodeQuality)
        run: |
          ruff check --output-format=github --output-file=code-quality-report.json
      - name: Upload code quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-code-quality
          path: code-quality-report.json

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install bandit
      - name: Bandit scan
        run: bandit -c pyproject.toml -r src/

  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/ruff:alpine
    steps:
      - uses: actions/checkout@v6
      - name: Ruff version
        run: ruff --version

      - name: Ruff format check
        run: ruff format --check

  image-build:
    name: Build & Push Image
    needs: [ruff-check, ruff-format, bandit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

