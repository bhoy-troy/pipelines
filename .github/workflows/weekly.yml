name: Weekly Milk Price Outlook

on:
  schedule:
    # Runs every Monday at 06:30 UTC.
    # Approximate local time:
    # - 07:30 Irish time during Irish summer time
    # - 06:30 Irish time during Irish winter time
    - cron: "30 6 * * 1"

  # Allows you to run it manually from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  send-outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.1"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly milk price outlook
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.run_weekly

      - name: Upload forecast artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-outlook-output
          path: |
            output/
            models/
          if-no-files-found: ignore