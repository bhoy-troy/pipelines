name: Weekly Milk Price Outlook

on:
  schedule:
    # Runs every Monday at 06:30 UTC.
    # Approximate local time:
    # - 07:30 Irish time during Irish summer time
    # - 06:30 Irish time during Irish winter time
    - cron: "30 6 * * 1"

  # Allows you to run it manually from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  send-outlook:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/bhoy-troy/dairy-estimate:0.0.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Run weekly milk price outlook
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m src.run_weekly

      - name: Upload forecast artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-outlook-output
          path: |
            output/
            models/
          if-no-files-found: ignore
